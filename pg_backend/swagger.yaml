                matricolaStudente:
                  type: string
                  description: Matricola dello studente
                idSlot:
                  type: string
                  description: ID dello slot da prenotare
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: File opzionali da allegare (PDF, immagini, ecc.)
      responses:
        '201':
          description: Prenotazione creata con successo
          content:
            application/json:
              schema:
