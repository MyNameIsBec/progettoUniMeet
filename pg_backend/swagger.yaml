openapi: '3.0.0'
info:
  title: UniMeet API
  description: API del sistema UniMeet per la gestione di ricevimenti docenti, prenotazioni, segnalazioni e bacheche di corsi di studi universitari.
  version: '1.0.0'
  contact:
    name: UniMeet Team

servers:
  - url: http://localhost:3000/api
    description: Server di sviluppo locale

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT ottenuto dal login

  schemas:
    # ─────────── ERROR MODELS ───────────
    ErroreBase:
      type: object
      properties:
        error:
          type: string
          description: Messaggio di errore
      required:
        - error

    ErroreValidazione:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              msg:
                type: string
              path:
                type: string
              location:
                type: string
              type:
                type: string

    Errore400:
      type: object
      properties:
        error:
          type: string

    Errore401:
      type: object
      properties:
        error:
          type: string
          example: Token richiesto

    Errore403:
      type: object
      properties:
        error:
          type: string
          example: Accesso negato

    Errore404:
      type: object
      properties:
        error:
          type: string
          example: Risorsa non trovata

    Errore409:
      type: object
      properties:
        error:
          type: string
          example: Email già in uso

    Errore500:
      type: object
      properties:
        error:
          type: string
          example: Errore interno del server

    MessaggioSuccesso:
      type: object
      properties:
        messaggio:
          type: string
      required:
        - messaggio

    # ─────────── AUTH SCHEMAS ───────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@studenti.unina.it
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        utente:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            ruolo:
              type: string
              enum: [STUDENTE, DOCENTE, AMMINISTRATORE]
            nome:
              type: string
            cognome:
              type: string
      required:
        - token
        - utente

    RegistrazioneStudenteRequest:
      type: object
      required:
        - matricola
        - nome
        - cognome
        - email
        - password
        - corsoDiStudi
      properties:
        matricola:
          type: string
          example: N01234567
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi
        email:
          type: string
          format: email
          example: mario.rossi@studenti.unina.it
        password:
          type: string
          format: password
          minLength: 8
          example: password123
        corsoDiStudi:
          type: string
          description: ID o nome del corso di studi
          example: IN1010

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@studenti.unina.it

    ForgotPasswordResponse:
      type: object
      properties:
        messaggio:
          type: string
          example: Se l'email esiste, riceverai un codice di verifica per il reset della password.
      required:
        - messaggio

    VerificaCodiceRequest:
      type: object
      required:
        - email
        - codice
      properties:
        email:
          type: string
          format: email
        codice:
          type: string
          example: 123456

    ResetPasswordRequest:
      type: object
      required:
        - email
        - codice
        - nuovaPassword
      properties:
        email:
          type: string
          format: email
        codice:
          type: string
          example: 123456
        nuovaPassword:
          type: string
          format: password
          minLength: 8
          example: nuovaPassword123

    RegistrazioneDocenteRequest:
      type: object
      required:
        - nome
        - cognome
        - email
        - password
        - ufficio
      properties:
        nome:
          type: string
          example: Luigi
        cognome:
          type: string
          example: Verdi
        email:
          type: string
          format: email
          example: luigi.verdi@unina.it
        password:
          type: string
          format: password
          minLength: 8
        ufficio:
          type: string
          example: Edificio 5, Stanza 12

    RegistrazioneAdminRequest:
      type: object
      required:
        - nome
        - email
        - password
      properties:
        nome:
          type: string
          example: Admin Uni
        email:
          type: string
          format: email
          example: admin@unimeet.it
        password:
          type: string
          format: password
          minLength: 8

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          example: vecchiaPassword123
        newPassword:
          type: string
          format: password
          minLength: 8
          example: nuovaPassword123

    ProfiloResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        nome:
          type: string
        cognome:
          type: string
        ruolo:
          type: string
          enum: [STUDENTE, DOCENTE, AMMINISTRATORE]
        matricola:
          type: string
        corsoDiStudi:
          type: object
        ufficio:
          type: string
        corsi:
          type: array
          items:
            type: object

    # ─────────── ADMIN SCHEMAS ───────────
    StatisticheResponse:
      type: object
      properties:
        totaleStudenti:
          type: integer
        totaleDocenti:
          type: integer
        totaleAmministratori:
          type: integer
        totalePrenotazioni:
          type: integer
        totaleSegnalazioni:
          type: integer
        prenotazioniMeseCorrente:
          type: integer
        slotTotali:
          type: integer
        slotOccupati:
          type: integer
        slotLiberi:
          type: integer
        giorniBloccati:
          type: integer

    CreaUtenteRequest:
      type: object
      required:
        - ruolo
        - nome
        - email
        - password
      properties:
        ruolo:
          type: string
          enum: [studente, docente, amministratore]
        nome:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        cognome:
          type: string
        matricola:
          type: string
        corsoDiStudi:
          type: string
        ufficio:
          type: string

    ModificaUtenteRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        cognome:
          type: string
        matricola:
          type: string
        corsoDiStudi:
          type: string
        ufficio:
          type: string

    Slot:
      type: object
      properties:
        id_slot:
          type: string
        data:
          type: string
          format: date
        ora_inizio:
          type: string
          example: 09:00:00
        ora_fine:
          type: string
          example: 10:00:00
        disponibilita:
          type: boolean
        id_docente:
          type: string
        docente:
          $ref: '#/components/schemas/DocenteSenzaPassword'
        luogo:
          $ref: '#/components/schemas/LuogoRicevimento'
        prenotazioni:
          type: array
          items:
            $ref: '#/components/schemas/Prenotazione'

    SlotSenzaRelazioni:
      type: object
      properties:
        id_slot:
          type: string
        data:
          type: string
          format: date
        ora_inizio:
          type: string
        ora_fine:
          type: string
        disponibilita:
          type: boolean
        id_docente:
          type: string

    CreaSlotRequest:
      type: object
      required:
        - docenteId
        - data
        - oraInizio
        - oraFine
      properties:
        docenteId:
          type: string
        data:
          type: string
          format: date
          example: '2026-06-15'
        oraInizio:
          type: string
          example: '09:00'
        oraFine:
          type: string
          example: '10:00'
        disponibilita:
          type: boolean
          default: true
        luogo:
          $ref: '#/components/schemas/LuogoInput'

    ModificaSlotRequest:
      type: object
      properties:
        data:
          type: string
          format: date
        oraInizio:
          type: string
        oraFine:
          type: string
        disponibilita:
          type: boolean
        docenteId:
          type: string
        luogo:
          $ref: '#/components/schemas/LuogoInput'

    LuogoInput:
      type: object
      properties:
        nomeAula:
          type: string
          example: Aula 101
        edificio:
          type: string
          example: Edificio Centrale
        piano:
          type: string
          example: Primo piano

    LuogoRicevimento:
      type: object
      properties:
        id_luogo:
          type: string
        nome_aula:
          type: string
        edificio:
          type: string
        piano:
          type: string
        latitudine:
          type: number
          format: float
          nullable: true
        longitudine:
          type: number
          format: float
          nullable: true
        id_slot:
          type: string

    SlotDateResponse:
      type: array
      items:
        type: object
        properties:
          data:
            type: string
            format: date
          count:
            type: integer

    BloccaGiornoRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          format: date
          example: '2026-06-14'
        motivo:
          type: string
          default: Festivo
          example: Festività nazionale

    GiornoBloccato:
      type: object
      properties:
        id_giorno:
          type: string
        data:
          type: string
          format: date
        motivo:
          type: string
        creato_il:
          type: string
          format: date-time

    # ─────────── PRENOTAZIONI SCHEMAS ───────────
    Prenotazione:
      type: object
      properties:
        id_prenotazione:
          type: string
        data_prenotazione:
          type: string
          format: date-time
        argomento:
          type: string
        descrizione:
          type: string
          nullable: true
        stato_prenotazione:
          type: string
          enum: [IN_ATTESA, CONFERMATO, COMPLETATO, ANNULLATO]
          default: IN_ATTESA
        matricola_studente:
          type: string
        id_slot:
          type: string
        slot:
          $ref: '#/components/schemas/SlotSenzaRelazioni'
        studente:
          $ref: '#/components/schemas/StudenteSenzaPassword'
        documenti:
          type: array
          items:
            $ref: '#/components/schemas/Documento'

    CreaPrenotazioneRequest:
      type: object
      required:
        - argomento
        - matricolaStudente
        - idSlot
      properties:
        argomento:
          type: string
          example: Ricevimento tesi
        descrizione:
          type: string
          example: Vorrei discutere la tesi
        matricolaStudente:
          type: string
          example: N01234567
        idSlot:
          type: string

    AggiornaStatoPrenotazioneRequest:
      type: object
      required:
        - stato
      properties:
        stato:
          type: string
          enum: [IN_ATTESA, CONFERMATO, COMPLETATO, ANNULLATO]

    Documento:
      type: object
      properties:
        id_documento:
          type: string
        nome_file:
          type: string
        tipo_file:
          type: string
        dimensione:
          type: integer
        data_caricamento:
          type: string
          format: date-time
        percorso_file:
          type: string
        id_prenotazione:
          type: string

    # ─────────── SEGNALAZIONI SCHEMAS ───────────
    Segnalazione:
      type: object
      properties:
        id_segnalazione:
          type: string
        oggetto:
          type: string
        descrizione:
          type: string
        data_invio:
          type: string
          format: date-time
        stato:
          type: string
          enum: [APERTA, IN_LAVORAZIONE, RISOLTA, CHIUSA]
          default: APERTA
        matricola_studente:
          type: string
          nullable: true
        id_docente:
          type: string
          nullable: true
        studente:
          $ref: '#/components/schemas/StudenteSenzaPassword'
        docente:
          $ref: '#/components/schemas/DocenteSenzaPassword'
        allegato:
          type: string
          nullable: true

    CreaSegnalazioneRequest:
      type: object
      required:
        - oggetto
        - descrizione
      properties:
        oggetto:
          type: string
          example: Problema con ricevimento
        descrizione:
          type: string
          example: Descrizione del problema...
        matricolaStudente:
          type: string
          example: N01234567

    CreaSegnalazioneDocenteRequest:
      type: object
      required:
        - oggetto
        - descrizione
        - idDocente
      properties:
        oggetto:
          type: string
        descrizione:
          type: string
        idDocente:
          type: string

    AggiornaStatoSegnalazioneRequest:
      type: object
      required:
        - stato
      properties:
        stato:
          type: string
          enum: [APERTA, IN_LAVORAZIONE, RISOLTA, CHIUSA]

    # ─────────── NOTIFICHE SCHEMAS ───────────
    Notifica:
      type: object
      properties:
        id_notifica:
          type: string
        titolo:
          type: string
        messaggio:
          type: string
        data_invio:
          type: string
          format: date-time
        tipo:
          type: string
        letta:
          type: boolean
          default: false
        destinatario_id:
          type: string
          nullable: true
        destinatario_ruolo:
          type: string
          nullable: true

    CreaNotificaRequest:
      type: object
      required:
        - titolo
        - messaggio
        - tipo
      properties:
        titolo:
          type: string
          example: Nuova prenotazione
        messaggio:
          type: string
          example: Hai una nuova prenotazione per il giorno...
        tipo:
          type: string
          example: PRENOTAZIONE
        destinatarioId:
          type: string
        destinatarioRuolo:
          type: string
          enum: [STUDENTE, DOCENTE, AMMINISTRATORE]

    # ─────────── DOCENTI SCHEMAS ───────────
    DocenteSenzaPassword:
      type: object
      properties:
        id_docente:
          type: string
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        ufficio:
          type: string

    DocenteDettaglio:
      type: object
      properties:
        id_docente:
          type: string
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        ufficio:
          type: string
        corsi:
          type: array
          items:
            $ref: '#/components/schemas/Corso'
        corsi_di_studi:
          type: array
          items:
            type: object
            properties:
              id_corso_di_studi:
                type: string
              nome:
                type: string

    DocenteStatsResponse:
      type: object
      properties:
        totaleSlots:
          type: integer
        totalePrenotazioni:
          type: integer
        prenotazioniConfermate:
          type: integer
        prenotazioniInAttesa:
          type: integer
        prenotazioniCompletate:
          type: integer

    CreaSlotDocenteRequest:
      type: object
      required:
        - data
        - oraInizio
        - oraFine
      properties:
        data:
          type: string
          format: date
          example: '2026-06-15'
        oraInizio:
          type: string
          example: '09:00'
        oraFine:
          type: string
          example: '10:00'
        luogo:
          $ref: '#/components/schemas/LuogoInput'

    ModificaSlotDocenteRequest:
      type: object
      properties:
        data:
          type: string
          format: date
        oraInizio:
          type: string
        oraFine:
          type: string
        disponibilita:
          type: boolean
        luogo:
          $ref: '#/components/schemas/LuogoInput'

    # ─────────── STUDENTI SCHEMAS ───────────
    StudenteSenzaPassword:
      type: object
      properties:
        matricola:
          type: string
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        id_corso_di_studi:
          type: string
        corso_di_studi:
          $ref: '#/components/schemas/CorsoDiStudi'

    StudenteProfilo:
      type: object
      properties:
        matricola:
          type: string
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        corso_di_studi:
          $ref: '#/components/schemas/CorsoDiStudi'

    AggiornaProfiloStudenteRequest:
      type: object
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
          format: email
        corsoDiStudi:
          type: string

    ChangePasswordStudenteRequest:
      type: object
      required:
        - vecchiaPw
        - nuovaPw
      properties:
        vecchiaPw:
          type: string
          format: password
          example: vecchiaPassword123
        nuovaPw:
          type: string
          format: password
          minLength: 8
          example: nuovaPassword123

    # ─────────── CORSI SCHEMAS ───────────
    CorsoDiStudi:
      type: object
      properties:
        id_corso_di_studi:
          type: string
        nome:
          type: string

    Corso:
      type: object
      properties:
        id_corso:
          type: string
        nome_corso:
          type: string
        anno:
          type: integer
        cfu:
          type: integer
        id_docente:
          type: string
        id_corso_di_studi:
          type: string
          nullable: true
        docente:
          $ref: '#/components/schemas/DocenteSenzaPassword'

    CreaCorsoRequest:
      type: object
      required:
        - nomeCorso
        - anno
        - cfu
        - idDocente
      properties:
        nomeCorso:
          type: string
          example: Ingegneria del Software
        anno:
          type: integer
          example: 3
        cfu:
          type: integer
          example: 9
        idDocente:
          type: string
        idCorsoDiStudi:
          type: string

    AggiornaCorsoRequest:
      type: object
      properties:
        nomeCorso:
          type: string
        anno:
          type: integer
        cfu:
          type: integer
        idDocente:
          type: string
        idCorsoDiStudi:
          type: string

    # ─────────── BACHECHE SCHEMAS ───────────
    Bacheca:
      type: object
      properties:
        id_bacheca:
          type: string
        titolo:
          type: string
        descrizione:
          type: string
        data_ultimo_aggiornamento:
          type: string
          format: date-time
        id_corso_di_studi:
          type: string
        corso_di_studi:
          $ref: '#/components/schemas/CorsoDiStudi'
        faqs:
          type: array
          items:
            $ref: '#/components/schemas/FAQ'

    AggiornaBachecaRequest:
      type: object
      properties:
        titolo:
          type: string
          example: Bacheca Ingegneria Informatica
        descrizione:
          type: string
          example: Benvenuti nella bacheca del corso di studi

    FAQ:
      type: object
      properties:
        id_faq:
          type: string
        domanda:
          type: string
        risposta:
          type: string
        data_pubblicazione:
          type: string
          format: date-time
        ultima_modifica:
          type: string
          format: date-time
        id_bacheca:
          type: string

    CreaFaqRequest:
      type: object
      required:
        - domanda
        - risposta
      properties:
        domanda:
          type: string
          example: Come prenoto un ricevimento?
        risposta:
          type: string
          example: Accedi al sistema e seleziona uno slot disponibile

    ModificaFaqRequest:
      type: object
      properties:
        domanda:
          type: string
        risposta:
          type: string

paths:
  # ═══════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════
  /login:
    post:
      tags:
        - Auth
      summary: Login utente
      description: Autentica un utente (studente, docente o amministratore) e restituisce un token JWT.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dati di input non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroreValidazione'
        '401':
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore401'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore500'

  /registrazione:
    post:
      tags:
        - Auth
      summary: Registrazione studente
      description: Crea un nuovo account studente.
      operationId: registrazioneStudente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrazioneStudenteRequest'
      responses:
        '201':
          description: Studente registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dati di input non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroreValidazione'
        '409':
          description: Email già in uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore409'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore500'

  /recupera-password:
    post:
      tags:
        - Auth
      summary: Richiedi reset password
      description: Invia una richiesta di reset password. Se l'email esiste, viene inviato un codice di verifica.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Richiesta elaborata (messaggio generico per sicurezza)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Dati di input non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroreValidazione'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore500'

  /auth/verifica-codice:
    post:
      tags:
        - Auth
      summary: Verifica codice reset password
      description: Verifica la validità del codice di reset password inviato via email.
      operationId: verificaCodice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificaCodiceRequest'
      responses:
        '200':
          description: Codice valido
