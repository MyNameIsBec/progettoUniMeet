<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book icon -->
  <rect x="15" y="25" width="50" height="65" rx="4" fill="url(#grad)" />
  <rect x="20" y="30" width="40" height="55" rx="2" fill="white" />
  <line x1="25" y1="40" x2="55" y2="40" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="50" x2="55" y2="50" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="60" x2="45" y2="60" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Academic cap -->
  <path d="M55 45 L80 32 L105 45 L80 58 Z" fill="url(#grad)" />
  <rect x="74" y="58" width="12" height="18" rx="2" fill="#2563eb" />
  <line x1="80" y1="45" x2="80" y2="58" stroke="#2563eb" stroke-width="2"/>

  <!-- Person icon -->
  <circle cx="145" cy="35" r="12" fill="url(#grad)" />
  <ellipse cx="145" cy="65" rx="18" ry="14" fill="url(#grad)" opacity="0.85" />

  <!-- Check mark -->
  <circle cx="185" cy="50" r="20" fill="#10b981" opacity="0.15" />
  <polyline points="176,50 182,57 194,43" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: UniMeet -->
  <text x="220" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="36" font-weight="800" fill="#1e293b">UniMeet</text>

  <!-- Subtitle -->
  <text x="220" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#64748b" letter-spacing="2">PRENOTAZIONE RICEVIMENTI</text>

  <!-- Decorative line -->
  <line x1="220" y1="92" x2="390" y2="92" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
</svg>
