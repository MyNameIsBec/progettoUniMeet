<header class="topbar">
  <div class="header-mobile-sinistra">
    <button class="toggle-menu" (click)="toggleMenu()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <div class="mobile-logo">
      <ion-icon name="calendar-outline"></ion-icon>
      <div>
        <strong>UniMeet</strong>
        <span>Area {{ ruoloAccount | titlecase }}</span>
      </div>
    </div>
  </div>

  @if (menuAperto) {
  <div class="overlay-mobile" (click)="toggleMenu()"></div>
  }
  <nav class="menu-mobile-top" [class.open]="menuAperto">
    <div class="drawer-header">
      <div class="drawer-logo-container">
        <ion-icon name="calendar-outline" class="main-logo-icon"></ion-icon>
        <div class="logo-text">
          <h1>UniMeet</h1>
          <span>Area {{ ruoloAccount | titlecase }}</span>
        </div>
      </div>
    </div>

    <div class="menu-items">
      @for (voce of vociMenuMobile; track voce.percorso) {
      <a [routerLink]="voce.percorso" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: voce.esatto || false}" (click)="chiudiMenu()">
        <ion-icon [name]="voce.icona"></ion-icon>
        <span>{{ voce.etichetta }}</span>
      </a>
      }
      
      <a class="logout-mobile" (click)="logout(); chiudiMenu()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Logout</span>
      </a>
    </div>
  </nav>

  <div class="topbar-actions">
    <button class="toggle-tema" (click)="toggleDarkMode()" [attr.title]="isDarkMode ? 'Modalità chiara' : 'Modalità scura'">
      <ion-icon [name]="isDarkMode ? 'sunny-outline' : 'moon-outline'"></ion-icon>
    </button>

    @if (!ruoloAdmin) {
    <button class="btn-notifiche" [routerLink]="getNotificheRoute()">
      <ion-icon name="notifications-outline"></ion-icon>
      @if (nonLette > 0) {
      <span class="notification-badge">{{ nonLette }}</span>
      }
    </button>
    }

    <div class="profilo-mini" (click)="vaiAlProfilo()">
      <div class="avatar-piccolo">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div>
        <strong>{{ nomeAccount }}</strong>
        <span>{{ ruoloAccount | titlecase }}</span>
      </div>
    </div>
  </div>
</header>
