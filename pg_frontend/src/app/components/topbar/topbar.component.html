<header class="topbar">
  <div class="mobile-header-left">
    <button class="menu-toggle" (click)="toggleMenu()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <div class="mobile-logo">
      <ion-icon name="calendar-outline"></ion-icon>
      <div>
        <strong>UniMeet</strong>
        <span>Area {{ ruoloUtente | titlecase }}</span>
      </div>
    </div>
  </div>

  <!-- MENU A TENDINA LATERALE (MOBILE ONLY) -->
  @if (menuAperto) {
  <div class="mobile-dropdown-overlay" (click)="toggleMenu()"></div>
  }
  <nav class="mobile-top-menu" [class.open]="menuAperto">
    <div class="drawer-header">
      <div class="drawer-logo-container">
        <ion-icon name="calendar" class="main-logo-icon"></ion-icon>
        <div class="logo-text">
          <h1>UniMeet</h1>
          <span>Area {{ ruoloUtente | titlecase }}</span>
        </div>
      </div>
    </div>

    <div class="menu-items">
      @for (voce of vociMenuMobile; track voce.percorso) {
      <a [routerLink]="voce.percorso" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: voce.esatto || false}" (click)="chiudiMenu()">
        <ion-icon [name]="voce.icona"></ion-icon>
        <span>{{ voce.etichetta }}</span>
      </a>
      }
      
      <a routerLink="/segnalazione" routerLinkActive="active" (click)="chiudiMenu()">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>Segnalazioni</span>
      </a>

      <a routerLink="/login" class="mobile-logout" (click)="chiudiMenu()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Logout</span>
      </a>
    </div>
  </nav>

  <!-- AZIONI DESKTOP -->
  <div class="topbar-actions">
    <button class="notification-button" routerLink="/notifiche">
      <ion-icon name="notifications-outline"></ion-icon>
      <span class="notification-badge">3</span>
    </button>

    <div class="student-profile-mini" routerLink="/profilo-studente">
      <div class="student-avatar-small">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div>
        <strong>{{ nomeUtente }}</strong>
        <span>{{ ruoloUtente | titlecase }}</span>
      </div>
    </div>
  </div>
</header>
