<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-row">
      <ion-icon name="calendar-outline"></ion-icon>
      <div>
        <h1>UniMeet</h1>
        <span>Area {{ ruoloUtente | titlecase }}</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (voce of vociMenu; track voce.percorso) {
      <a [routerLink]="voce.percorso" 
         [class.active]="isLinkActive(voce)">
        <ion-icon [name]="voce.icona"></ion-icon>
        <span>{{ voce.etichetta }}</span>
      </a>
    }

    <a class="logout-link" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon>
      <span>Logout</span>
    </a>
  </nav>

  <button class="sidebar-theme-toggle" (click)="toggleDarkMode()" [attr.title]="isDarkMode ? 'Modalità chiara' : 'Modalità scura'">
    <ion-icon [name]="isDarkMode ? 'sunny-outline' : 'moon-outline'"></ion-icon>
    <span>{{ isDarkMode ? 'Modalità chiara' : 'Modalità scura' }}</span>
  </button>
</aside>
