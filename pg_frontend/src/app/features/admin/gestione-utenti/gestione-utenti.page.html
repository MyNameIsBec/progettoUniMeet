<ion-header>
  <ion-toolbar>
    <ion-title>Gestione Utenti</ion-title>
  </ion-toolbar>
  <ion-toolbar class="segment-toolbar">
    <ion-segment [value]="activeSegment">
      <ion-segment-button value="dashboard" routerLink="/dashboard-admin">
        <ion-label>Dashboard</ion-label>
      </ion-segment-button>
      <ion-segment-button value="utenti" routerLink="/gestione-utenti">
        <ion-label>Gestione Utenti</ion-label>
      </ion-segment-button>
      <ion-segment-button value="slot" routerLink="/gestione-slot-admin">
        <ion-label>Slot</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-placeholder">
    <ion-icon name="people-outline"></ion-icon>
    <h2>Gestione Utenti</h2>
    <p>Prossimamente — elenco utenti con ricerca, filtri e CRUD.</p>
  </div>
</ion-content>
