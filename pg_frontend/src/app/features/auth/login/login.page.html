<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-wrapper">
    <button class="back-btn" (click)="goTo('/')">
      <ion-icon name="arrow-back-outline"></ion-icon>
      Torna alla home
    </button>

    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-row">
          <ion-icon name="calendar-outline" class="logo-icon"></ion-icon>
          <span class="logo-name">UniMeet</span>
        </div>
        <p class="logo-sub">Accedi al tuo account</p>
      </div>
      <div class="error-banner" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>
      <form [formGroup]="loginForm" (ngSubmit)="effettuaLogin()">
        <div class="field-group">
          <label class="field-label">Email universitaria</label>
          <div class="field-wrap" [class.has-error]="email.invalid && email.touched">
            <ion-icon name="mail-outline" class="field-icon"></ion-icon>
            <ion-input type="email" formControlName="email" placeholder="nome.cognome@univ.it"
              class="field-input"></ion-input>
          </div>
          <span class="field-error-msg" *ngIf="email.invalid && email.touched">
            <ng-container *ngIf="email.errors?.['required']">L'email è obbligatoria</ng-container>
            <ng-container *ngIf="email.errors?.['email']">Formato email non valido</ng-container>
          </span>
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-wrap" [class.has-error]="password.invalid && password.touched">
            <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
            <ion-input [type]="mostraPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Inserisci la password" class="field-input"></ion-input>
            <button type="button" class="eye-btn" (click)="cambiaVisibilitaPassword()">
              <ion-icon [name]="mostraPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <span class="field-error-msg" *ngIf="password.invalid && password.touched">
            <ng-container *ngIf="password.errors?.['required']">La password è obbligatoria</ng-container>
            <ng-container *ngIf="password.errors?.['minlength']">Minimo 6 caratteri</ng-container>
          </span>
        </div>
        <div class="form-options">
          <ion-checkbox formControlName="rememberMe" labelPlacement="end" class="remember-check">
            Ricordami
          </ion-checkbox>
          <button type="button" class="link-btn" (click)="goTo('/recupera-password')">
            Password dimenticata?
          </button>
        </div>
        <ion-button expand="block" type="submit" class="submit-btn" [disabled]="inCaricamento">
          <ion-spinner *ngIf="inCaricamento" name="crescent" slot="start"></ion-spinner>
          <ion-icon *ngIf="!inCaricamento" name="log-in-outline" slot="start"></ion-icon>
          {{ inCaricamento ? 'Accesso in corso…' : 'Accedi' }}
        </ion-button>

      </form>

      <p class="switch-hint">
        Sei uno studente e non hai ancora un account?
        <button class="link-btn bold" (click)="goTo('/registrazione')">Registrati</button>
      </p>

    </div>
  </div>
</ion-content>
