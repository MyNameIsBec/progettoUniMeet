<app-dashboard-layout>
  <section class="page-header">
    <h2>Le mie prenotazioni</h2>
    <p>Gestisci i tuoi appuntamenti e visualizza lo storico dei ricevimenti.</p>
  </section>

  <section class="riepilogo-content">
    
    <div class="filters-bar">
      <div class="search-box">
        <ion-icon name="calendar-clear-outline"></ion-icon>
        <input type="text" placeholder="Cerca per docente o materia...">
      </div>
      <ion-button fill="outline">
        <ion-icon name="filter-outline" slot="start"></ion-icon>
        Filtra
      </ion-button>
    </div>

    <div class="prenotazioni-list">
      <ion-card *ngFor="let p of prenotazioni" class="booking-card">
        <ion-card-content>
          <div class="card-header-row">
            <div class="docente-info">
              <h3>{{ p.docente }}</h3>
              <p>{{ p.materia }}</p>
            </div>
            <ion-badge [color]="p.statoColor">{{ p.stato | uppercase }}</ion-badge>
          </div>

          <div class="details-grid">
            <div class="detail-item">
              <ion-icon name="calendar-outline"></ion-icon>
              <span>{{ p.data }}</span>
            </div>
            <div class="detail-item">
              <ion-icon name="time-outline"></ion-icon>
              <span>{{ p.ora }}</span>
            </div>
            <div class="detail-item">
              <ion-icon name="location-outline"></ion-icon>
              <span>{{ p.aula }}</span>
            </div>
          </div>

          <div class="card-actions">
            <ion-button fill="clear" color="primary">
              Dettagli
              <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger">Annulla</ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </div>

  </section>
</app-dashboard-layout>
